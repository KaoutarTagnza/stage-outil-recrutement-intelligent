<div class="login-container">
  <p class="page-eyebrow">RecrutementIA</p>
  <h1>Connexion</h1>

  <form (ngSubmit)="onSubmit()">
    <div class="champ">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" required>
    </div>

    <div class="champ">
      <label for="motDePasse">Mot de passe</label>
      <input type="password" id="motDePasse" name="motDePasse" [(ngModel)]="motDePasse" required>
    </div>

    <p class="erreur" *ngIf="erreur()">{{ erreur() }}</p>

    <button type="submit" [disabled]="chargement()">
      {{ chargement() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p class="lien-bas">Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
</div>
