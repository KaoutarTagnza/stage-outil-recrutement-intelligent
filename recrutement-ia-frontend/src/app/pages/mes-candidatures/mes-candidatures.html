<div class="candidatures-container">
  <h1>Mes candidatures</h1>

  <p *ngIf="chargement()">Chargement...</p>
  <p *ngIf="!chargement() && candidatures().length === 0">Vous n'avez postulé à aucune offre.</p>

  <div class="candidature-card" *ngFor="let c of candidatures()">
    <h2>{{ c.offreTitre }}</h2>
    <span class="statut" [class]="c.statut">{{ c.statut }}</span>
    <p>Déposée le {{ c.dateDepot | date:'dd/MM/yyyy' }}</p>

    <p *ngIf="c.scoreMatching !== null">Score de correspondance : {{ c.scoreMatching }}%</p>

    <div *ngIf="!c.cvFichierUrl">
      <input type="file" accept=".pdf" (change)="onFichierChange($event, c.id)">
      <button (click)="deposerCv(c.id)" [disabled]="enCoursUpload() === c.id">
        {{ enCoursUpload() === c.id ? 'Envoi...' : 'Déposer mon CV' }}
      </button>
    </div>

    <p *ngIf="c.cvFichierUrl" class="cv-depose">✓ CV déjà déposé</p>
  </div>
</div>
