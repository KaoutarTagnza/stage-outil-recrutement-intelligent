<style>
#mcd2 svg.erDiagram .divider path { stroke-opacity: 0.5; }
#mcd2 svg.erDiagram .row-rect-odd path,
#mcd2 svg.erDiagram .row-rect-odd rect,
#mcd2 svg.erDiagram .row-rect-even path,
#mcd2 svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="mcd2"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('mcd2-svg', `erDiagram
  UTILISATEUR ||--o{ OFFRE : cree
  UTILISATEUR ||--o{ LOGACTION : genere
  CANDIDAT ||--o{ CANDIDATURE : soumet
  CANDIDAT ||--o{ NOTIFICATION : recoit
  CANDIDAT ||--o{ CANDIDAT_COMPETENCE : possede
  COMPETENCE ||--o{ CANDIDAT_COMPETENCE : referencee
  OFFRE ||--o{ CANDIDATURE : recoit
  OFFRE ||--o{ OFFRE_COMPETENCE : requiert
  COMPETENCE ||--o{ OFFRE_COMPETENCE : referencee
  CANDIDATURE ||--|| CV : contient
  CANDIDATURE |o--o| ENTRETIEN : planifie
  ENTRETIEN |o--o| EVALUATION : genere
  UTILISATEUR {
    int id PK
    string nom
    string email
    string motDePasse
    string role
  }
  CANDIDAT {
    int id PK
    string nom
    string email
    string telephone
  }
  COMPETENCE {
    int id PK
    string nom
  }
  OFFRE {
    int id PK
    int recruteurId FK
    string titre
    string description
    date dateCreation
    string statut
  }
  OFFRE_COMPETENCE {
    int offreId FK
    int competenceId FK
  }
  CANDIDAT_COMPETENCE {
    int candidatId FK
    int competenceId FK
  }
  CANDIDATURE {
    int id PK
    int candidatId FK
    int offreId FK
    date dateDepot
    string statut
  }
  CV {
    int id PK
    int candidatureId FK
    string fichierUrl
    string competencesExtraites
    float scoreMatching
  }
  ENTRETIEN {
    int id PK
    int candidatureId FK
    date dateEntretien
    string questionsGenerees
    string notes
  }
  EVALUATION {
    int id PK
    int entretienId FK
    float noteGlobale
    string commentaire
    string decision
  }
  NOTIFICATION {
    int id PK
    int candidatId FK
    string message
    date dateEnvoi
    boolean lu
  }
  LOGACTION {
    int id PK
    int utilisateurId FK
    string action
    date dateHeure
  }`);
document.getElementById('mcd2').innerHTML = svg;
document.querySelectorAll('#mcd2 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#mcd2 svg.erDiagram .row-rect-odd path, #mcd2 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
