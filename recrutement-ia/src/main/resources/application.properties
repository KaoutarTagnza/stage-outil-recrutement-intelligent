spring.application.name=recrutement-ia

# Base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/recrutement_ia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (7 jours de validite, pratique pendant le developpement)
jwt.secret=changeCetteCleEnProductionEnVariableDenvironnementSVP123456
jwt.expiration-ms=604800000

# Upload de fichiers (CV)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/cv

server.port=8080