<div id="cd3"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('cd3-svg', `classDiagram
  Utilisateur <|-- Admin
  Utilisateur <|-- Recruteur
  class Utilisateur {
    +int id
    +String nom
    +String email
    +String motDePasse
    +String role
  }
  class Candidat {
    +int id
    +String nom
    +String email
    +String telephone
  }
  class Offre {
    +int id
    +String titre
    +String description
    +Date dateCreation
    +String statut
  }
  class Competence {
    +int id
    +String nom
  }
  class Candidature {
    +int id
    +Date dateDepot
    +String statut
  }
  class CV {
    +int id
    +String fichierUrl
    +String competencesExtraites
    +float scoreMatching
  }
  class Entretien {
    +int id
    +Date dateEntretien
    +String questionsGenerees
    +String notes
  }
  class Evaluation {
    +int id
    +float noteGlobale
    +String commentaire
    +String decision
  }
  class Notification {
    +int id
    +String message
    +Date dateEnvoi
    +boolean lu
  }
  class LogAction {
    +int id
    +String action
    +Date dateHeure
  }
  Recruteur "1" --> "*" Offre : cree
  Offre "*" --> "*" Competence : requiert
  Candidat "*" --> "*" Competence : possede
  Candidat "1" --> "*" Candidature : soumet
  Offre "1" --> "*" Candidature : recoit
  Candidature "1" --> "1" CV : contient
  Candidature "1" --> "0..1" Entretien : planifie
  Entretien "1" --> "0..1" Evaluation : genere
  Candidat "1" --> "*" Notification : recoit
  Utilisateur "1" --> "*" LogAction : genere`);
document.getElementById('cd3').innerHTML = svg;
document.querySelectorAll('#cd3 svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
